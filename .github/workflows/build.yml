name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP'ni ochish
        run: unzip -q ./*.zip -d project

      - name: Debug APK build
        id: build
        continue-on-error: true
        working-directory: project
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Logni yuklash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonwall-build-log
          path: build.log

      - name: APK yuklash
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: neonwall-apk
          path: project/app/build/outputs/apk/debug/*.apk

      - name: Xato bo'lsa to'xtatish
        if: steps.build.outcome != 'success'
        run: exit 1
